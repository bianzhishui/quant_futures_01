# ---------- 成本模型（冻结；保守统一近似，按品种精确表待预注册细化） ----------
cost:
  slippage_bps: 5          # 滑点 0.05% 单边
  commission_bps: 2        # 手续费 0.02% 单边（≈ 交易所标准×2 的统一保守近似）
  margin_ratio: 0.10       # 保证金率 10%

# ---------- 回测约定（冻结） ----------
backtest:
  start_date: "2010-01-01" # 回测统一起点（2026-09-21 样本外扩窗：2018 → 2010，见 docs/outsample_plan.md）
  vol_target: 0.15         # 组合目标年化波动
  vol_window: 60           # 滚动年化波动窗口（日）
  vol_min: 0.05            # 年化波动下限（截断防爆仓）
  max_pos_ratio: 2.0       # 单品种名义持仓上限（× 权益）
  signal_mode: "next_open" # 收盘信号 → 次日开盘成交
  vol_estimator: "cov"     # 波动率目标组合波动估计：cov（协方差，新默认）/ linear（线性，旧）

# ---------- 策略（时序动量/横截面动量，预注册 docs/tsmom_plan.md、docs/xsmom_plan.md） ----------
strategy:
  tsmom_lookback: 120      # TSMOM 回看窗口（计划冻结；CLI --lookback 覆盖仅用于灵敏度诊断）
  xsmom_lookback: 120      # XSMOM 排序回看窗口（计划冻结；CLI --lookback 覆盖仅用于灵敏度诊断）
  xsmom_quantile: 0.25     # XSMOM 分位（短腿 ≤ q、长腿 ≥ 1-q；计划冻结）

# ---------- 实验/生产参数（冻结区，改动需预注册） ----------
params:
  window: 21                  # 回看窗口（脚手架占位，待研究设计确定）
  top_ratio: 0.2              # 取头部比例（脚手架占位，待研究设计确定）

# ---------- 门槛/限制 ----------
limits:
  min_n: 50                   # 样本 < 50 跳过

# ---------- 数据抓取（fetch 类脚本参数） ----------
fetch:
  sample:
    pause: 0.15               # 请求间停顿(秒)
    backoff: 90               # 退避秒数

# ---------- 监控 ----------
monitor:
  baseline_start: "2018-01-01"
