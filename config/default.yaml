# ============================================================
# 全量配置（权威基底）
# 加载规则（src/quant_futures/config.py）：
#   1. 始终加载本文件（缺失 → 报错，无兜底）
#   2. 若指定 --config / APP_CONFIG 配置文件 → 深合并覆盖本文件（同 key 覆盖）
#   3. 指定文件不存在 → 报错退出
#   4. 代码不 hardcode 配置值；冻结参数偏离校验以本文件为基准（见 config.py FROZEN_PARAMS）
# ============================================================

# ---------- 路径（相对仓库根，加载时统一解析为绝对路径） ----------
paths:
  data: "data"                # 数据根目录
  output: "output"            # 输出（账本/CSV/图）

# ---------- 实验/生产参数（冻结区，改动需预注册） ----------
params:
  window: 21                  # 回看窗口
  top_ratio: 0.2              # 取头部比例

# ---------- 门槛/限制 ----------
limits:
  min_n: 50                   # 样本 < 50 跳过

# ---------- 数据抓取（fetch 类脚本参数） ----------
fetch:
  sample:
    pause: 0.15               # 请求间停顿(秒)
    backoff: 90               # 退避秒数

# ---------- 监控 ----------
monitor:
  baseline_start: "2020-01-01"
