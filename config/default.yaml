# ============================================================
# 全量配置（权威基底）
# 加载规则（src/quant_futures_01/config.py）：
#   1. 始终加载本文件（缺失 → 报错，无兜底）
#   2. 若指定 --config / APP_CONFIG 配置文件 → 深合并覆盖本文件（同 key 覆盖）
#   3. 指定文件不存在 → 报错退出
#   4. 代码不 hardcode 配置值；冻结参数偏离校验以本文件为基准（见 config.py FROZEN_PARAMS）
# 预注册方案：docs/infrastructure_plan.md（2026-09-20 批准）
# ============================================================

# ---------- 路径（相对仓库根，加载时统一解析为绝对路径） ----------
paths:
  data: "data"                # 数据根目录
  output: "output"            # 输出（账本/CSV/图）

# ---------- 数据管道（fetch/清洗/复权） ----------
data:
  start_date: "2018-01-01"        # 拉取起始日（回测统一窗口起点）
  source: "akshare"               # 数据源：akshare（sina 主力连续）
  main_dir: "futures_main_daily"  # 主连日线 parquet 子目录（相对 paths.data）
  adjust_threshold: 0.20          # 后复权：单日 |收益| > 阈值 视为换月跳变（冻结）

